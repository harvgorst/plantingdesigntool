<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
  <rect x="0" y="0" width="1200" height="860" fill="#ffffff"/>
  <!-- boundary fence -->
  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#3a3a3a" stroke-width="6"/>
  <g stroke="#3a3a3a" stroke-width="2">
    <line x1="0" y1="0" x2="0" y2="800"/>
  </g>
  <!-- house wall and doors -->
  <rect x="0" y="800" width="1200" height="60" fill="#d9d4cc" stroke="#3a3a3a" stroke-width="4"/>
  <text x="600" y="840" font-family="Arial" font-size="22" text-anchor="middle" fill="#3a3a3a">HOUSE</text>
  <line x1="480" y1="800" x2="720" y2="800" stroke="#ffffff" stroke-width="6"/>
  <!-- patio -->
  <rect x="300" y="640" width="600" height="160" fill="#e8e4dc" stroke="#6b6b6b" stroke-width="2"/>
  <g stroke="#b9b4aa" stroke-width="1">
    <line x1="400" y1="640" x2="400" y2="800"/><line x1="500" y1="640" x2="500" y2="800"/><line x1="600" y1="640" x2="600" y2="800"/><line x1="700" y1="640" x2="700" y2="800"/><line x1="800" y1="640" x2="800" y2="800"/>
    <line x1="300" y1="720" x2="900" y2="720"/>
  </g>
  <text x="600" y="690" font-family="Arial" font-size="18" text-anchor="middle" fill="#6b6b6b">PATIO</text>
  <!-- curved lawn -->
  <path d="M330 600 C300 460 380 300 560 270 C740 240 900 300 930 430 C960 560 860 610 700 615 C560 620 360 640 330 600 Z" fill="#eef3e6" stroke="#6b6b6b" stroke-width="2"/>
  <text x="630" y="450" font-family="Arial" font-size="20" text-anchor="middle" fill="#6b6b6b">LAWN</text>
  <!-- stepping stones to shed -->
  <g fill="#e8e4dc" stroke="#6b6b6b" stroke-width="1.5">
    <ellipse cx="960" cy="400" rx="26" ry="18"/><ellipse cx="1005" cy="340" rx="26" ry="18"/><ellipse cx="1040" cy="280" rx="26" ry="18"/>
  </g>
  <!-- shed -->
  <rect x="960" y="30" width="210" height="200" fill="#e2ddd4" stroke="#3a3a3a" stroke-width="3"/>
  <line x1="960" y1="30" x2="1170" y2="230" stroke="#9a948a" stroke-width="1"/><line x1="1170" y1="30" x2="960" y2="230" stroke="#9a948a" stroke-width="1"/>
  <text x="1065" y="138" font-family="Arial" font-size="18" text-anchor="middle" fill="#3a3a3a">SHED</text>
  <!-- existing birch -->
  <circle cx="150" cy="130" r="190" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="14 8"/>
  <circle cx="150" cy="130" r="14" fill="#6b6b6b"/>
  <text x="150" y="175" font-family="Arial" font-size="16" text-anchor="middle" fill="#3a3a3a">EXISTING BIRCH (RETAIN)</text>
  <!-- water butt -->
  <circle cx="930" cy="70" r="30" fill="none" stroke="#6b6b6b" stroke-width="2"/>
  <text x="930" y="76" font-family="Arial" font-size="12" text-anchor="middle" fill="#3a3a3a">WB</text>
  <!-- dimension: 12.00 m across the top fence -->
  <g stroke="#b0402f" stroke-width="1.5" fill="#b0402f">
    <line x1="0" y1="-0" x2="0" y2="0"/>
  </g>
  <text x="600" y="24" font-family="Arial" font-size="16" text-anchor="middle" fill="#b0402f">12.00 m</text>
  <line x1="10" y1="34" x2="1190" y2="34" stroke="#b0402f" stroke-width="1.2"/>
  <line x1="10" y1="26" x2="10" y2="42" stroke="#b0402f" stroke-width="1.2"/>
  <line x1="1190" y1="26" x2="1190" y2="42" stroke="#b0402f" stroke-width="1.2"/>
  <text x="20" y="790" font-family="Arial" font-size="14" fill="#6b6b6b">SITE SURVEY · SCALE 1:50 @ A3 · DIMENSIONS IN METRES</text>
</svg>
