<title>Garden Planting Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a calm planting-plan studio. Title block across the top, a full-width tool strip and properties bar beneath it, then the plan beside the plant library and schedule, which sit side by side. */
:root {
  --paper: #F4EFE4; --panel: #FBF8F1; --ink: #2F2B25; --muted: #7B7266; --line: #E0D7C6; --line-soft: #EBE4D6;
  --accent: #667D5E; --accent-ink: #FFFDF8; --accent-soft: #E5E9DA;
  --ground: #F1EBDF; --grid: #E3DACA; --grid-major: #D2C6B1;
  --bed: #E6D6BE; --lawn: #DEE5CA; --pathc: #E6E0D4; --struct: #D6CFC2; --water: #CADDE1; --tree: #C0CCAC;
  --sun: #D9A93F; --shade: #7D8FA6; --wet: #5F93AA;
  --warn: #A06C1E; --crit: #A8402F;
  --r-canopy: #2F5A3C; --r-understory: #4B807B; --r-shrub: #7E9A55; --r-herbaceous: #9C5378; --r-ground: #A39543; --r-tuber: #B97B42; --r-climber: #5D6FA3; --bar-edge: rgba(47, 43, 37, 0.2); --label: #000000; --exist: #7B7266;
  --f-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-mono: "Source Serif 4", Georgia, serif;
}


:root { color-scheme: light; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, output { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; gap: 10px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1; margin: 0; letter-spacing: -0.005em; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 19px; line-height: 1.1; margin: 0; }
.lbl, .tb > span, .pf > span, .field > span { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.spacer { flex: 1; }
#status { font-size: 12px; color: var(--muted); font-style: italic; white-space: nowrap; }
#status.err { color: var(--crit); font-style: normal; }

/* header title block */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand .lbl { letter-spacing: 0.14em; }
.titleblock { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; min-width: 0; }
.tb { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tb input[type=text] { width: 13em; }
.tb .dim { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.tb .dim input { width: 4.6em; color: var(--ink); }
.tb output { padding: 5px 0; font-variant-numeric: tabular-nums; }
.tb .row { flex-wrap: nowrap; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 12px; cursor: pointer; line-height: 1.3; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--crit); }
.btn.danger.solid { background: var(--crit); border-color: var(--crit); color: var(--panel); }
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: rgba(20, 18, 15, 0.38); }
.modal .card { max-width: 440px; width: 100%; overflow: visible; gap: 14px; padding: 22px; box-shadow: 0 18px 50px rgba(20, 18, 15, 0.25); }
.modal h2 { font-size: 24px; }
.btn.sm { padding: 3px 10px; font-size: 13px; }
select, input[type=text], input[type=number] { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 8px; min-width: 0; }
input[type=number] { font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }

/* tool strip */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 2px; }
.tool { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid transparent; border-radius: 8px; background: transparent; cursor: pointer; font-size: 14px; }
.tool:hover { background: var(--paper); }
.tool[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
.tool kbd { display: none; }
.tsep { width: 1px; align-self: stretch; background: var(--line); }
.sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--muted); flex: none; }
.sw.round { border-radius: 50%; }
.zoom { display: flex; align-items: center; gap: 6px; }
.ul { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ulop input { width: 84px; accent-color: var(--accent); vertical-align: middle; }
.btn:disabled { opacity: .45; cursor: default; }
.confirm-inline { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.zoom .seg button { padding: 3px 10px; }
#zoomLbl { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }

/* properties bar */
.props { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-height: 46px; padding: 6px 14px; border-bottom: 1px solid var(--line); }
.hint { color: var(--muted); font-style: italic; }
.insp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; flex: 1; min-width: 0; }
.pk { font-family: var(--f-display); font-size: 19px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.pf { display: inline-flex; align-items: center; gap: 7px; }
.pf input[type=text] { width: 11em; }
.pf input.n { width: 5em; }
.pv { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.pv i { color: var(--ink); }
.insp .acts { display: flex; gap: 6px; margin-left: auto; }

/* work area */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; min-height: 0; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.side > .card { flex: 1 1 0; }
.card > * { flex-shrink: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; overflow: auto; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

#libSearch { width: 100%; }
.lib { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.lib li { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 9px; align-items: center; padding: 6px 7px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.lib li:hover { background: var(--paper); }
.lib li[aria-selected=true] { border-color: var(--accent); background: var(--accent-soft); }
.lib .nm { min-width: 0; }
.lib .nm b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib .nm i { color: var(--muted); font-size: 12.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib .meta { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; line-height: 1.3; }
.empty { color: var(--muted); font-size: 13px; font-style: italic; }
.ex.exist { color: var(--muted); }
.ex { font-family: var(--f-body); font-size: 9.5px; font-style: normal; font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 5px; vertical-align: 2px; }

.mapwrap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
/* the plan is a light drawing sheet in every theme, so labels stay black */
.mapwrap { color-scheme: light; color: #2F2B25;
  --panel: #FBF8F1; --paper: #F4EFE4; --ink: #2F2B25; --muted: #7B7266; --line: #E0D7C6; --line-soft: #EBE4D6;
  --accent: #667D5E; --accent-ink: #FFFDF8; --accent-soft: #E5E9DA; --crit: #A8402F; --warn: #A06C1E;
  --ground: #F1EBDF; --grid: #E3DACA; --grid-major: #D2C6B1; --bed: #E6D6BE;
  --r-canopy: #2F5A3C; --r-understory: #4B807B; --r-shrub: #7E9A55; --r-herbaceous: #9C5378; --r-ground: #A39543; --r-tuber: #B97B42; --r-climber: #5D6FA3;
  --label: #000000; --exist: #7B7266; }
#map.can-pan { cursor: grab; } #map.panning, #map.panning * { cursor: grabbing !important; }
#map { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#map text { font-family: var(--f-body); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--panel); }
.overlay .card { max-width: 400px; width: 100%; overflow: visible; }

.field { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: center; font-size: 13.5px; }
.field input, .field select { width: 100%; }
.field input[type=checkbox], .field input[type=color] { width: auto; }
label.checks { flex-wrap: nowrap; align-items: baseline; gap: 6px; }
.side > .card:has(#editPane:not([hidden])) { flex-grow: 3; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.checks { display: flex; gap: 10px; flex-wrap: wrap; }
.checks label { display: inline-flex; gap: 4px; align-items: center; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: 12.5px; color: var(--muted); }
.confirm { background: var(--paper); border-radius: 8px; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }

table.sched { width: 100%; border-collapse: collapse; font-size: 13px; }
.sched th { text-align: left; font-weight: 400; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--line); padding: 4px; }
.sched td { padding: 5px 4px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.sched td.n, .sched th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sched tfoot td { border-bottom: 0; font-weight: 600; padding-top: 7px; }
.sched i { color: var(--muted); }
table.sched.wide { font-size: 14px; min-width: 640px; }
.sched.wide td, .sched.wide th { padding: 7px 8px; }
.sched.wide tfoot td { font-size: 15px; }

.months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; align-items: end; height: 64px; }
.months div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; }
.months .bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.months .bar.zero { background: var(--line); }
.months span { font-size: 10.5px; color: var(--muted); }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.swatches button { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid var(--bar-edge); cursor: pointer; padding: 0; }
.swatches button[aria-pressed=true] { outline: 2px solid var(--accent); outline-offset: 2px; }
.colrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.colrow input[type=color] { width: 34px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 1px; }
.fdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--bar-edge); vertical-align: 0; margin-right: 3px; }
.app.cal { grid-template-rows: auto minmax(0, 1fr); }
.calview { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.calhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.calhead h2 { font-size: 26px; }
.prefgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; max-width: 1100px; }
fieldset.pref { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.field > span.row { font-size: 13.5px; text-transform: none; letter-spacing: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.sortb { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
.sortb:hover { color: var(--ink); }
.dbt td { vertical-align: middle; }
.top { flex-wrap: wrap; align-items: center; gap: 8px 28px; padding-bottom: 0; }
.top h1 { font-size: 24px; padding: 6px 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 0 22px; align-self: stretch; }
.tabs button { border: 0; background: none; padding: 10px 0 9px; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-size: 14.5px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed=true] { color: var(--ink); border-bottom-color: var(--accent); }
.gbox { display: flex; gap: 6px; align-items: center; }
.gbox select { max-width: 240px; }
.menuwrap { position: relative; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 25; min-width: 240px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(20, 18, 15, 0.16); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.mi { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.mi:hover:not(:disabled) { background: var(--paper); }
.mi:disabled { opacity: .45; cursor: default; }
.mi.danger { color: var(--crit); }
.mi.ulop input { width: 110px; }
.rolecols { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 12px; }
.rolecol { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.rolecol input[type=color] { width: 34px; height: 26px; padding: 1px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); flex: none; }
fieldset.pref legend { font-family: var(--f-display); font-weight: 600; font-size: 19px; padding: 0 6px; }
fieldset.pref .field { grid-template-columns: 110px 1fr; }
.pv-sample { background: var(--ground); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: #000; font-weight: 500; min-height: 2.6em; display: flex; align-items: center; }
.calscroll { overflow-x: auto; }
.cal-grid { min-width: 720px; display: grid; grid-template-columns: minmax(170px, 240px) minmax(0, 1fr); column-gap: 14px; }
.cal-months, .ctrack, .cal-seasons { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.cal-seasons span { font-family: var(--f-display); font-style: italic; font-size: 15px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 2px; margin: 0 2px; }
.cal-months span { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); text-align: center; padding: 6px 0; }
.cname { padding: 7px 0; border-top: 1px solid var(--line-soft); min-width: 0; }
.cname b { font-weight: 600; } .cname i { color: var(--muted); font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cname .q { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ctrack { border-top: 1px solid var(--line-soft); background-image: linear-gradient(to right, var(--line-soft) 1px, transparent 1px); background-size: calc(100% / 12) 100%; align-items: center; }
.cbar { grid-row: 1; height: 20px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--bar-edge); margin: 0 3px; }
.cbar.unset { background: repeating-linear-gradient(45deg, var(--accent-soft) 0 5px, var(--panel) 5px 10px); }
.cnone { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); font-style: italic; padding-left: 6px; }
.csum { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.cmix { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0 6px; height: 64px; }
.cmix div { display: flex; flex-direction: column-reverse; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.cmix div span { flex: 1; }
.ccount { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); text-align: center; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 4px; }
.ccount .gap { color: var(--crit); }

@media (max-width: 1200px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-rows: none; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: 66vh; min-height: 360px; }
  .side > .card { flex: none; }
  .card { overflow: visible; }
}
@media (max-width: 700px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: 60vh; }
  .tb input[type=text] { width: 100%; }
  .titleblock, .tb { width: 100%; }
  .tsep { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <h1>Garden Planting Map</h1>
    <nav class="tabs" aria-label="Pages"><button type="button" id="navPlan" aria-pressed="true">Plan</button><button type="button" id="navSched" aria-pressed="false">Plant schedule</button><button type="button" id="navCal" aria-pressed="false">Flowering calendar</button><button type="button" id="navDb" aria-pressed="false">Plant database</button><button type="button" id="navPrefs" aria-pressed="false">Preferences</button></nav>
    <div class="spacer"></div>
    <div class="gbox"><select id="gardenSel" aria-label="Choose a garden"></select><button class="btn sm" id="detailsBtn" type="button">Garden details</button></div>
    <span id="status">Connecting…</span>
  </header>

  <nav class="toolbar" aria-label="Tools">
    <div class="tools" id="tools"></div>
    <div class="tsep"></div>
    <div class="menuwrap">
      <button class="btn sm" id="ulMenuBtn" type="button" aria-expanded="false" aria-controls="ulMenu">Site plan ▾</button>
      <div class="menu" id="ulMenu" hidden role="group" aria-label="Site plan">
        <button class="mi" id="ulImport" type="button">Import plan…</button>
        <input type="file" id="ulFile" accept=".svg,.pdf,image/svg+xml,application/pdf,image/png,image/jpeg,image/webp" hidden>
        <button class="mi" id="ulScale" type="button">Set scale</button>
        <label class="mi ulop"><span>Transparency</span><input type="range" id="ulOpacity" min="10" max="100" step="5" value="60" aria-label="Plan opacity"></label>
        <button class="mi" id="ulToggle" type="button">Hide plan</button>
        <button class="mi danger" id="ulRemove" type="button">Remove plan</button>
        <p class="note" style="margin:2px 4px 0">SVG, PDF (page 1), PNG or JPEG.</p>
      </div>
    </div>
    <div class="seg" role="group" aria-label="Plant size shown">
      <button type="button" id="vMature" aria-pressed="true" title="Plants drawn at mature spread (5–10 years)">Design intent</button>
      <button type="button" id="vPlanted" aria-pressed="false" title="Plants drawn at supplied pot size">As planted</button>
    </div>
    <div class="spacer"></div>
    <button class="btn sm" id="undoBtn" type="button" title="Undo (Ctrl+Z)">Undo</button>
    <div class="zoom"><div class="seg" role="group" aria-label="Zoom"><button type="button" id="zOut" aria-label="Zoom out" title="Zoom out (−)">−</button><button type="button" id="zFit" title="Fit whole garden (0)">Fit</button><button type="button" id="zIn" aria-label="Zoom in" title="Zoom in (+)">+</button></div><span id="zoomLbl">100%</span></div>
  </nav>

  <div class="props" aria-live="polite"><div class="insp" id="inspector" hidden></div><span class="hint" id="hint"></span></div>

  <section class="calview" id="calView" hidden aria-label="Flowering calendar"></section>

  <section class="calview" id="prefsView" hidden aria-labelledby="prefsH"></section>

  <section class="calview" id="dbView" hidden aria-labelledby="dbH">
    <div class="calhead"><div><span class="lbl">Plant database</span><h2 id="dbH">Every plant you’ve entered</h2></div>
      <div class="row"><span class="note" id="dbCount"></span><button class="btn sm" type="button" id="dbCopy">Copy all for spreadsheet</button><button class="btn sm primary" type="button" id="dbAdd">Add species</button></div></div>

<script>
(() => {
'use strict';
const ROLES = { canopy: 'Canopy', understory: 'Understory', shrub: 'Shrub', herbaceous: 'Herbaceous', ground: 'Ground cover', tuber: 'Tubers & bulbs', climber: 'Climbers' };

const layerOf = r => ROLES[r] ? r : (OLD_ROLES[r] || 'herbaceous');

const MOIST = { dry: 'Dry', moist: 'Moist', wet: 'Wet' };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FLOWER_COLOURS = [['White','#FFFFFF'],['Cream','#F3EBC8'],['Pale yellow','#F4E58A'],['Yellow','#F2C531'],['Gold','#E0A526'],['Orange','#E8862F'],['Apricot','#F1B48A'],['Coral','#EE7F6E'],
  ['Red','#C92F2F'],['Crimson','#9E1F3A'],['Burgundy','#6E1E33'],['Magenta','#C2307E'],['Hot pink','#E4549A'],['Pink','#EE9BBE'],['Pale pink','#F6CFDB'],['Lilac','#C9A7D9'],
  ['Lavender','#A894D2'],['Violet','#7B5BB5'],['Purple','#5E3A8C'],['Blue','#4A6FC2'],['Sky blue','#8EB6E3'],['Lime green','#B9CF6A'],['Green','#7FA35A'],['Bronze','#9C6B3A']];

const AREA = { bed: 'Planting bed', drift: 'Drift', zone: 'Condition zone' };
const TOOLS = [
  { id: 'select', label: 'Select', key: 'V or Space' },
  { id: 'plant', label: 'Plant', key: 'P', sw: 'var(--r-shrub)', round: true },
  { id: 'drift', label: 'Drift', key: 'D', sw: 'var(--r-herbaceous)', blob: true },
  { id: 'bed', label: 'Bed outline', key: 'B', sw: 'var(--bed)', blob: true },

const HINTS = {
  select: 'Click anything to edit it, drag to move it. Drag a white handle to reshape a curve. Drag empty space or scroll to pan; pinch or use + / − to zoom.',

  drift: 'Pick a species, then click around the drift’s edge. Double-click, press Enter or click the first point to close it.',
  bed: 'Click around the bed’s edge to draw a curved outline. Double-click, press Enter or click the first point to close it.',
  zone: 'Click around an area to mark its light and moisture. Double-click, press Enter or click the first point to close it.',

const DRAW_HINT = 'Click to add points. Double-click, press Enter or click the first point to finish. Backspace removes the last point, Esc cancels.';

const PREF_DEFAULTS = { labelSize: 1, showLabels: true, labelMode: 'code', labelQty: true, showGrid: true, gridStep: 'auto', showRulers: true, showScale: true, snap: 0.1, defaultView: 'mature', currency: '£', roleColors: {} };
const ROLE_DEFAULTS = { canopy: '#2F5A3C', understory: '#4B807B', shrub: '#7E9A55', herbaceous: '#9C5378', ground: '#A39543', tuber: '#B97B42', climber: '#5D6FA3', existing: '#7B7266' };
function applyRoleColours() {

    const v = rc[k] && /^#[0-9a-f]{6}$/i.test(rc[k]) ? rc[k] : null, name = k === 'existing' ? '--exist' : '--r-' + k;

}
const S = {
  db: null, assets: null, online: false,
  plants: [], gardens: [], g: null,
  tool: 'select', activePlant: null, view: 'mature',
  sel: null, editPlant: null, confirm: null,
  drag: null, history: [], loaded: false, filter: '',
  zoom: 1, cx: null, cy: null, pinch: null, space: false,
  prefs: { ...PREF_DEFAULTS }, prefsLoaded: false,
  draw: null, hover: null, cal: null, ulHidden: false, localUl: null, busy: false, newGarden: false,

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const snap = v => { const st = clamp(num(S.prefs.snap, 0.1), 0.05, 1); return st > 0 ? Math.round(Math.round(v / st) * st * 1000) / 1000 : Math.round(v * 1000) / 1000; };
const r2 = v => Math.round(v * 100) / 100;
const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const money = v => (S.prefs.currency || '£') + (Math.round(v * 100) / 100).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const plantById = id => S.plants.find(p => p.id === id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
function setStatus(t, err) { const el = $('status'); el.textContent = t; el.classList.toggle('err', !!err); }
function plantLabel(p) {
  if (!p) return '?';
  if (S.prefs.labelMode === 'common') return p.common || code(p);

  return code(p);
}
function code(p) {
  if (!p) return '?';
  const b = (p.botanical || '').replace(/['"‘’“”×]/g, '').split(/\s+/).filter(Boolean);
  if (b.length >= 2) return b[0].slice(0, 3) + ' ' + b[1].slice(0, 3).toLowerCase();

}
function spreadOf(p) { if (!p) return 0.5; if (p.existing) return num(p.spread, 0.5); return S.view === 'mature' ? num(p.spread, 0.5) : num(p.potSpread, 0.2); }

function defaultDensity(p) { const s = num(p?.spread, 0.5); return Math.round((1 / (s * s)) * 10) / 10; }

/* ---------- curve geometry (closed Catmull-Rom splines) ---------- */
function segs(pts, closed) {

}
function pathD(pts, smooth, closed = true) {

  if (!smooth || pts.length < 3) return 'M' + pts.map(p => f(p[0]) + ' ' + f(p[1])).join(' L') + (closed ? ' Z' : '');
  return 'M' + f(pts[0][0]) + ' ' + f(pts[0][1]) + segs(pts, closed).map(([, a, b, c]) => ` C${f(a[0])} ${f(a[1])} ${f(b[0])} ${f(b[1])} ${f(c[0])} ${f(c[1])}`).join('') + (closed ? ' Z' : '');
}
function sampled(a) {
  if (!a.smooth || a.pts.length < 3) return a.pts;
  const out = [];
  for (const [p1, c1, c2, p2] of segs(a.pts, true)) for (let s = 0; s < 12; s++) {
    const t = s / 12, u = 1 - t;
    out.push([u * u * u * p1[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p2[0], u * u * u * p1[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p2[1]]);

}
function areaOf(a) { const P = sampled(a); let s = 0; for (let i = 0; i < P.length; i++) { const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length]; s += x1 * y2 - x2 * y1; } return Math.abs(s) / 2; }
function centreOf(a) {
  const P = sampled(a); let A = 0, cx = 0, cy = 0;
  for (let i = 0; i < P.length; i++) { const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length]; const c = x1 * y2 - x2 * y1; A += c; cx += (x1 + x2) * c; cy += (y1 + y2) * c; }

}
function driftQty(a) { return Math.max(1, Math.round(areaOf(a) * num(a.density, defaultDensity(plantById(a.plantId))))); }

/* ---------- history & saving ---------- */
function checkpoint() { if (!S.g) return; S.history.push(JSON.stringify(S.g)); if (S.history.length > 60) S.history.shift(); }
function undo() { const prev = S.history.pop(); if (!prev) return; S.g = JSON.parse(prev); if (S.sel && !findSel()) S.sel = null; saveGarden(); renderAll(); }
let saveTimer = null, saving = false, saveAgain = false;
function saveGarden() {
  if (!S.g) return;
  S.g.updatedAt = Date.now();
  if (!S.online) { setStatus('Not saved in this view'); return; }
  setStatus('Unsaved changes…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 700);
}
async function flushSave() {
  saveTimer = null;
  if (saving) { saveAgain = true; return; }
  saving = true; setStatus('Saving…');
  const body = JSON.parse(JSON.stringify(S.g)); delete body.id;
  try { await S.db.doc('gardens/' + S.g.id).set(body); setStatus('Saved'); }
  catch (e) { setStatus(e?.code === 'quota_exceeded' ? 'Storage full: delete an old garden' : 'Couldn’t save: ' + (e?.message || 'try again'), true); }

  if (saveAgain) { saveAgain = false; flushSave(); }
}
const busy = () => saveTimer || saving || S.drag || S.draw;

/* ---------- selection ---------- */
function findSel() {
  if (!S.sel || !S.g) return null;
  const list = S.sel.kind === 'area' ? S.g.areas : S.g.plantings;
  return list.find(x => x.id === S.sel.id) || null;
}
function select(kind, id) { S.sel = kind ? { kind, id } : null; if (S.confirm === 'underlay') S.confirm = null; renderInspector(); renderMap(); }
function removeSel() {
  const it = findSel(); if (!it) return;

  S.g[key] = S.g[key].filter(x => x !== it);

}

/* ---------- map ---------- */
const svg = $('map');
function ulUrl(u) { return u?.assetId ? '/_blob/' + u.assetId : (S.localUl || ''); }
let rafPending = false;
function renderMapSoon() { if (rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; renderMap(); }); }
function renderMap() {
  const g = S.g;

  const W = g.width, D = g.depth, M = Math.max(W, D);
  const pad = M * 0.07, fs = M / 55 / S.zoom, px = (M / 900) / S.zoom;
  if (S.cx == null) { S.cx = W / 2; S.cy = D / 2; }

      parts.push(`<g data-kind="area" data-id="${a.id}"><path d="${d}" style="fill:${col};stroke:${isSel ? 'var(--accent)' : col}" fill-opacity="0.12" stroke-width="${isSel ? 2.5 : 1.5}" stroke-dasharray="6 4" vector-effect="non-scaling-stroke" pointer-events="none"/><path d="${d}" fill="none" stroke="transparent" stroke-width="12" vector-effect="non-scaling-stroke" pointer-events="stroke" style="cursor:move"/><text x="${c.x}" y="${c.y}" font-size="${fs * 0.95}" text-anchor="middle" style="fill:${col};cursor:move;font-style:italic">${esc(text)}</text></g>`);

      parts.push(`<g data-kind="area" data-id="${a.id}" style="cursor:move"><path d="${d}" style="fill:${col};stroke:${isSel ? 'var(--accent)' : col}" fill-opacity="${ex ? 0.13 : S.view === 'mature' ? 0.32 : 0.18}" stroke-width="${isSel ? 2.5 : 1.5}" ${ex ? 'stroke-dasharray="5 3"' : ''} vector-effect="non-scaling-stroke"/>${showL ? `<text x="${c.x}" y="${c.y + ls * 0.25}" font-size="${ls * 0.72}" text-anchor="middle" style="fill:var(--label);font-weight:500${ex ? ';font-style:italic' : ''}">${S.prefs.labelQty ? driftQty(a) + ' ' : ''}${esc(plantLabel(p))}</text>` : ''}</g>`);

  if (!$('detailsModal').hidden) { if (e.key === 'Escape') { e.preventDefault(); closeDetails(); } return; }
  if (!$('ulMenu').hidden && e.key === 'Escape') { closeUlMenu(); $('ulMenuBtn').focus(); return; }
  if (!$('plantModal').hidden && e.key === 'Escape') { S.editPlant = null; S.confirm = null; renderLibrary(); return; }
  if (!$('clearModal').hidden) { if (e.key === 'Escape') { e.preventDefault(); closeClear(); } return; }
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (S.draw) {
    if (e.key === 'Enter') { e.preventDefault(); finishDraw(); return; }
    if (e.key === 'Escape') { S.draw = null; S.hover = null; renderTools(); renderMap(); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); S.draw.pts.pop(); if (!S.draw.pts.length) S.draw = null; renderTools(); renderMap(); return; }
  }
  if (e.key === '+' || e.key === '=') { zoomBy(1.4); return; }
  if (e.key === '-' || e.key === '_') { zoomBy(1 / 1.4); return; }
  if (e.key === '0') { resetView(); renderMap(); return; }
  if (e.key === ' ') { e.preventDefault(); if (!e.repeat) setTool('select'); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { if (S.sel) { e.preventDefault(); removeSel(); } return; }
  if (e.key === 'Escape') { setTool('select'); select(null); return; }
  const t = TOOLS.find(x => x.key.toLowerCase() === e.key.toLowerCase()); if (t) setTool(t.id);
});

/* ---------- data ---------- */
function normGarden(id, d) {
  return { id, name: d.name || 'Untitled garden', client: d.client || '', width: num(d.width, 10), depth: num(d.depth, 8),
    underlay: d.underlay && d.underlay.natW ? d.underlay : null,
    areas: Array.isArray(d.areas) ? d.areas.filter(a => a.kind !== 'zone' && Array.isArray(a.pts) && a.pts.length >= 3) : [],
    plantings: Array.isArray(d.plantings) ? d.plantings : [], updatedAt: d.updatedAt || 0, example: !!d.example };
}
function openGarden(id) {
  if (saveTimer) { clearTimeout(saveTimer); flushSave(); }
  const g = S.gardens.find(x => x.id === id); if (!g) return;
  S.g = JSON.parse(JSON.stringify(g)); S.history = []; S.sel = null; S.draw = null; S.cal = null; S.confirm = null;
  if (S.tool === 'scale') S.tool = 'select';
  store.set('gpm.last', id); resetView(); renderAll();
}
async function init() {
  renderAll();
  const use = n => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, assets] = await Promise.all([use('db'), use('assets')]);
  S.assets = assets;
  if (!db) { S.loaded = true; S.online = false; setStatus('Not saved in this view'); renderAll(); return; }
  S.db = db; S.online = true; setStatus('Loading…');
  let gotPlants = false, gotGardens = false;
  const ready = () => { if (gotPlants && gotGardens && !S.loaded) { S.loaded = true; setStatus(S.assets ? 'Saved' : 'Saved · plan import needs edit access'); renderAll(); } };
  db.doc('settings/prefs').onSnapshot(snap => {
    if (prefTimer) return;
    const first = !S.prefsLoaded; S.prefsLoaded = true;
    S.prefs = { ...PREF_DEFAULTS, ...(snap.exists ? snap.data() : {}) };
    if (first) S.view = S.prefs.defaultView === 'planted' ? 'planted' : 'mature';
    applyRoleColours();
    if (getPage() === 'preferences' && !document.activeElement?.dataset?.pref) renderPrefs();
    if (S.loaded) renderAll();
  }, () => {});
  db.collection('plants').onSnapshot(snap => {
    S.plants = snap.docs.map(d => { const x = { id: d.id, ...d.data() }; x.role = layerOf(x.role); return x; });
    gotPlants = true;
    if (S.loaded) { if (!S.editPlant) renderLibrary(); refreshDerived(); if (S.sel) renderInspector(); renderTools(); }
    ready();
  }, err => setStatus('Plant library unavailable: ' + (err?.message || ''), true));
  db.collection('gardens').onSnapshot(snap => {
    S.gardens = snap.docs.map(d => normGarden(d.id, d.data())).sort((a, b) => a.name.localeCompare(b.name));
    gotGardens = true;
    if (!S.g) {
      const last = store.get('gpm.last');
      const pick = S.gardens.find(g => g.id === last) || S.gardens.find(g => !g.example) || S.gardens[0];
      if (pick) S.g = JSON.parse(JSON.stringify(pick));
      if (S.loaded) renderAll();
    } else if (!busy() && !snap.metadata.hasPendingWrites) {
      const remote = S.gardens.find(g => g.id === S.g.id);
      if (remote && remote.updatedAt > (S.g.updatedAt || 0)) { S.g = JSON.parse(JSON.stringify(remote)); if (S.sel && !findSel()) S.sel = null; renderAll(); }
      else renderPicker();
    } else renderPicker();
    ready();
  }, err => setStatus('Gardens unavailable: ' + (err?.message || ''), true));
}

  const head = ['Common name', 'Botanical name', 'Cultivar / rootstock', 'Layer', 'Existing', 'Flowers from', 'Flowers to', 'Flower colour', 'Height (m)', 'Spread (m)', 'Spread as planted (m)', 'Supply', 'Unit cost', 'Supplier', 'Gardens used in'];

  setTimeout(() => { b.textContent = 'Copy all for spreadsheet'; }, 1600);
